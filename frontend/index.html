<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070e13" id="theme-color" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="PennyHarvester — Polymarket 高胜率尾盘策略实盘执行与模拟演练工作台" />
    <title>PennyHarvester · Polymarket 尾盘策略工作台</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('pennyharvester.theme')
          var isDark = stored !== 'light'
          document.documentElement.classList.toggle('dark', isDark)
          var meta = document.getElementById('theme-color')
          if (meta) meta.setAttribute('content', isDark ? '#070e13' : '#10232d')
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
